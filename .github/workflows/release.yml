name: Release

on:
  schedule:
    - cron: "5 5 1 * *"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Upstream tag to build, or latest"
        required: true
        default: latest
        type: string
      force_rebuild:
        description: "Rebuild and replace assets if the release exists"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.tag_name || 'latest' }}
  cancel-in-progress: false

env:
  GLIBC_VERSION: "2.17"
  UPSTREAM_REPOSITORY: tree-sitter/tree-sitter
  ZIG_VERSION: "0.16.0"
  CARGO_ZIGBUILD_VERSION: "0.23.4"

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          requested="${REQUESTED_TAG:-latest}"
          if [[ "${{ github.event_name }}" == "schedule" || "$requested" == "latest" ]]; then
            tag_name=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)
          else
            tag_name="$requested"
          fi

          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid upstream tag: $tag_name"
            exit 1
          fi

          gh api "repos/${UPSTREAM_REPOSITORY}/git/ref/tags/${tag_name}" --silent

          should_build=true
          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && [[ "${FORCE_REBUILD:-false}" != "true" ]]; then
            should_build=false
            echo "Release $tag_name already exists; nothing to do."
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "### Upstream release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$tag_name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build required: \`$should_build\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }}
    if: needs.resolve.outputs.should_build == 'true'
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            zig_arch: x86_64
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            zigbuild_sha256: 6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            zig_arch: aarch64
            zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            zigbuild_sha256: 25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419
    env:
      CARGO_TERM_COLOR: always
      RUST_TARGET: ${{ matrix.rust_target }}
      ZIG_ARCH: ${{ matrix.zig_arch }}
      ZIG_SHA256: ${{ matrix.zig_sha256 }}
      ZIGBUILD_SHA256: ${{ matrix.zigbuild_sha256 }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.rust_target }}
          rustflags: ""

      - name: Install and verify Zig
        run: |
          set -euo pipefail

          archive="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          url="https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/zig" --strip-components=1

          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install and verify cargo-zigbuild
        run: |
          set -euo pipefail

          archive="cargo-zigbuild-${RUST_TARGET}.tar.xz"
          url="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "${ZIGBUILD_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-zigbuild"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cargo-zigbuild" --strip-components=1
          "$RUNNER_TEMP/cargo-zigbuild/cargo-zigbuild" --version
          echo "$RUNNER_TEMP/cargo-zigbuild" >> "$GITHUB_PATH"

      - name: Build tree-sitter CLI
        run: |
          set -euo pipefail

          export CARGO_PROFILE_RELEASE_STRIP=symbols
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)

          cargo zigbuild \
            --locked \
            --release \
            --target "${RUST_TARGET}.${GLIBC_VERSION}" \
            --package tree-sitter-cli

      - name: Verify executable and glibc baseline
        id: verify
        run: |
          set -euo pipefail

          binary="target/${RUST_TARGET}/release/tree-sitter"
          test -x "$binary"
          "$binary" --version
          file "$binary"

          # Recent upstream releases export allocator hooks for external scanners.
          # Verify these survive linking and stripping when upstream requests them.
          if grep -R -q -- '--dynamic-list' crates/cli/build.rs cli/build.rs 2>/dev/null; then
            nm -D --defined-only "$binary" > "$RUNNER_TEMP/dynamic-symbols.txt"
            for symbol in ts_current_malloc ts_current_calloc ts_current_realloc ts_current_free; do
              if ! awk '{print $NF}' "$RUNNER_TEMP/dynamic-symbols.txt" | grep -Fx "$symbol"; then
                echo "::error::Missing external scanner allocator symbol: $symbol"
                exit 1
              fi
            done
          fi

          mapfile -t glibc_versions < <(
            readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
              | sort -Vu
          )
          if (( ${#glibc_versions[@]} == 0 )); then
            echo "::error::No GLIBC symbol versions found in $binary"
            exit 1
          fi

          highest=${glibc_versions[-1]#GLIBC_}
          if [[ "$(printf '%s\n' "$highest" "$GLIBC_VERSION" | sort -V | tail -n1)" != "$GLIBC_VERSION" ]]; then
            echo "::error::Binary requires GLIBC_$highest, newer than GLIBC_$GLIBC_VERSION"
            exit 1
          fi

          echo "highest_glibc=$highest" >> "$GITHUB_OUTPUT"
          echo "Verified maximum required symbol version: GLIBC_$highest"

      - name: Smoke test on glibc 2.17
        run: |
          set -euo pipefail

          docker run --rm --network none \
            --volume "$PWD/target/${RUST_TARGET}/release:/dist:ro" \
            "quay.io/pypa/manylinux2014_${ZIG_ARCH}:latest" \
            /bin/bash -euo pipefail -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              /dist/tree-sitter --version
              /dist/tree-sitter build --help
            '

      - name: Package release assets
        env:
          PLATFORM: ${{ matrix.platform }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail

          binary="target/${RUST_TARGET}/release/tree-sitter"
          mkdir -p dist package
          install -m 0755 "$binary" package/tree-sitter
          touch -d "@$(git show -s --format=%ct HEAD)" package/tree-sitter

          gzip --best --no-name --stdout package/tree-sitter \
            > "dist/tree-sitter-${PLATFORM}-glibc-${GLIBC_VERSION}.gz"
          (
            cd package
            zip -X -9 "../dist/tree-sitter-cli-${PLATFORM}-glibc-${GLIBC_VERSION}.zip" tree-sitter
          )

          cat > "dist/tree-sitter-${PLATFORM}-build-info.txt" <<EOF
          source_repository=https://github.com/${UPSTREAM_REPOSITORY}
          source_tag=${UPSTREAM_TAG}
          source_commit=$(git rev-parse HEAD)
          rust_target=${RUST_TARGET}
          rustc=$(rustc --version)
          zig=$(zig version)
          cargo_zigbuild=$(cargo zigbuild --version)
          glibc_baseline=${GLIBC_VERSION}
          highest_required_glibc=${{ steps.verify.outputs.highest_glibc }}
          glibc_2_17_smoke_test=passed
          EOF

          (cd dist && sha256sum * > "SHA256SUMS-${PLATFORM}")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tree-sitter-${{ matrix.platform }}-glibc-2.17
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: needs.resolve.outputs.should_build == 'true'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tree-sitter-*-glibc-2.17
          path: dist
          merge-multiple: true

      - name: Prepare checksums and release notes
        run: |
          set -euo pipefail

          rm -f dist/SHA256SUMS-*
          (cd dist && sha256sum *.gz *.zip *-build-info.txt | sort -k2 > SHA256SUMS)

          cat > release-notes.md <<EOF
          Unofficial tree-sitter CLI build from upstream [${TAG_NAME}](https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${TAG_NAME}).

          - Linux x86-64 and ARM64
          - linked for a glibc ${GLIBC_VERSION} baseline
          - built from the upstream lockfile
          - ELF symbol-version requirement checked during CI
          - runtime smoke test passed in a glibc 2.17 manylinux2014 container
          - SHA-256 checksums and GitHub build-provenance attestations included

          These binaries are best-effort builds and are not supported by the tree-sitter project.
          EOF

          ls -l dist

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.gz
            dist/*.zip
            dist/*-build-info.txt
            dist/SHA256SUMS

      - name: Create or update release
        run: |
          set -euo pipefail

          release_args=()
          if [[ "$TAG_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG_NAME" \
              --title "tree-sitter CLI ${TAG_NAME} (glibc ${GLIBC_VERSION})" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* \
              "${release_args[@]}" \
              --target "$GITHUB_SHA" \
              --title "tree-sitter CLI ${TAG_NAME} (glibc ${GLIBC_VERSION})" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi

          echo "### Published release" >> "$GITHUB_STEP_SUMMARY"
          echo "[$TAG_NAME](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME)" \
            >> "$GITHUB_STEP_SUMMARY"
